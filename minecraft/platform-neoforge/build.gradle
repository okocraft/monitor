plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = project.rootProject.group
version = project.rootProject.version
base.archivesName = 'Monitor-NeoForge'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
        content { includeGroup 'ca.spottedleaf' }
    }
    maven { url = 'https://repo.lucko.me/' }
}

neoForge {
    version = '26.2.0.88'
    mods { monitor { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.monitor
    }
}

dependencies {
    implementation project(':monitor-core')
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'net.kyori:adventure-api:5.2.0'
    compileOnly 'net.kyori:adventure-text-serializer-gson:5.2.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'net.luckperms:api:5.5'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    jarJar(implementation('com.zaxxer:HikariCP:7.1.0')) { version { strictly '7.1.0' } }
    jarJar(implementation('com.mysql:mysql-connector-j:9.1.0')) { version { strictly '9.1.0' } }
    jarJar(implementation('dev.siroshun.codec4j:codec4j-api:0.2.0-beta.6')) { version { strictly '0.2.0-beta.6' } }
    jarJar(implementation('dev.siroshun.codec4j:codec4j-io-base64:0.2.0-beta.6')) { version { strictly '0.2.0-beta.6' } }
    jarJar(implementation('dev.siroshun.codec4j:codec4j-io-gson:0.2.0-beta.6')) { version { strictly '0.2.0-beta.6' } }
    jarJar(implementation('dev.siroshun.codec4j:codec4j-io-gzip:0.2.0-beta.6')) { version { strictly '0.2.0-beta.6' } }
    jarJar(implementation('dev.siroshun.codec4j:codec4j-io-yaml:0.2.0-beta.6')) { version { strictly '0.2.0-beta.6' } }
    jarJar(implementation('io.minio:minio:9.0.3')) { version { strictly '9.0.3' } }
    jarJar(implementation('club.minnced:discord-webhooks:0.8.4')) { version { strictly '0.8.4' } }
    jarJar(implementation('ca.spottedleaf:leafpile:1.2.2') { transitive = false }) { version { strictly '1.2.2' } }

    [
        'dev.siroshun.jfun:jfun-function:1.0.0-beta.3',
        'dev.siroshun.jfun:jfun-result:1.0.0-beta.3',
        'net.kyori:adventure-api:5.2.0',
        'net.kyori:adventure-key:5.2.0',
        'net.kyori:adventure-text-serializer-plain:5.2.0',
        'net.kyori:adventure-text-serializer-gson:5.2.0',
        'net.kyori:adventure-text-serializer-json:5.2.0',
        'net.kyori:option:1.1.0',
        'com.carrotsearch.thirdparty:simple-xml-safe:2.7.1',
        'com.squareup.okhttp3:okhttp-jvm:5.3.2',
        'com.squareup.okio:okio-jvm:3.16.4',
        'org.jetbrains.kotlin:kotlin-stdlib:2.2.21',
        'com.fasterxml.jackson.core:jackson-annotations:2.21',
        'com.fasterxml.jackson.core:jackson-core:2.21.2',
        'com.fasterxml.jackson.core:jackson-databind:2.21.2',
        'org.bouncycastle:bcprov-jdk18on:1.84',
        'org.xerial.snappy:snappy-java:1.1.10.8',
        'org.json:json:20230618',
        'com.google.protobuf:protobuf-java:4.26.1'
    ].each { coordinate ->
        def requiredVersion = coordinate.tokenize(':').last()
        jarJar(implementation(coordinate) { transitive = false }) { version { strictly requiredVersion } }
    }
    jarJar(implementation('org.yaml:snakeyaml:2.5') { transitive = false }) {
        version { strictly '[2.0,3.0)'; prefer '2.5' }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
tasks.named('test', Test) { useJUnitPlatform() }
configurations.testRuntimeClasspath.resolutionStrategy.force 'org.yaml:snakeyaml:2.0'
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar', Jar) {
    from project(':monitor-core').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Minecraft provides SLF4J; constrain only this platform to its bundled API.
configurations.configureEach { resolutionStrategy.force 'org.slf4j:slf4j-api:2.0.17' }
